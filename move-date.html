<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>voy · Move date</title>
  <link rel="stylesheet" href="/src/css/app.css" />
  <style>
    body { background-color: #19301E; }
    /* modal slide-up on mobile */
    #modal {
      animation: slideUp 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }
    .day-btn.current-date {
      border: 2px solid #cbd5e1;
      color: #334155;
    }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex items-end md:items-center justify-center p-0 md:p-6">

  <!-- Backdrop (acts as dimmed background) -->
  <div class="fixed inset-0 bg-voy-green/80 backdrop-blur-sm md:bg-gray-900/60" @click="history.back()"></div>

  <!-- Modal card -->
  <div id="modal" x-data="calendar" class="relative z-10 bg-white w-full md:max-w-sm md:rounded-3xl rounded-t-3xl overflow-hidden shadow-2xl">

    <!-- Header -->
    <div class="flex items-center justify-between px-5 pt-5 pb-4 border-b border-gray-100">
      <div class="w-8"></div><!-- spacer -->
      <h1 class="text-xs font-bold tracking-[0.12em] uppercase text-gray-900" x-text="modalTitle"></h1>
      <a href="index.html" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors text-gray-400 hover:text-gray-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </a>
    </div>

    <div class="px-5 pt-5 pb-2">
      <p class="text-sm text-gray-500 text-center mb-5" x-text="modalSubtitle"></p>

      <!-- Month nav -->
      <div class="flex items-center justify-between mb-4">
        <button @click="prevMonth()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <p class="text-sm font-bold tracking-wide uppercase text-gray-900" x-text="monthLabel"></p>
        <button @click="nextMonth()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <!-- Day headers — single letter -->
      <div class="grid grid-cols-7 mb-1">
        <div class="text-center text-[11px] font-semibold text-gray-400 py-1">M</div>
        <div class="text-center text-[11px] font-semibold text-gray-400 py-1">T</div>
        <div class="text-center text-[11px] font-semibold text-gray-400 py-1">W</div>
        <div class="text-center text-[11px] font-semibold text-gray-400 py-1">T</div>
        <div class="text-center text-[11px] font-semibold text-gray-400 py-1">F</div>
        <div class="text-center text-[11px] font-semibold text-gray-400 py-1">S</div>
        <div class="text-center text-[11px] font-semibold text-gray-400 py-1">S</div>
      </div>

      <!-- Day grid -->
      <div class="grid grid-cols-7 gap-y-1 mb-5">
        <template x-for="(d, i) in days" :key="i">
          <div>
            <template x-if="d.empty"><div></div></template>
            <template x-if="!d.empty">
              <button
                :class="d.classes"
                :disabled="d.isDisabled"
                @click="!d.isDisabled && selectDay(d.date)"
                x-text="d.day"
              ></button>
            </template>
          </div>
        </template>
      </div>
    </div>

    <!-- Summary card + CTA -->
    <div class="mx-4 mb-5 bg-gray-50 rounded-2xl px-4 py-4">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs text-gray-400" x-text="orderLabel"></span>
        <span class="text-xs font-semibold text-gray-700 bg-voy-stone px-2 py-0.5 rounded-full" x-text="currentDateDisplay"></span>
      </div>
      <div class="flex items-center justify-between" x-show="!isBilling">
        <span class="text-xs text-gray-400">Estimated delivery on</span>
        <span class="text-xs font-semibold text-gray-700" x-text="deliveryDateDisplay"></span>
      </div>
    </div>

    <div class="px-4 pb-8">
      <button
        @click="confirm()"
        :disabled="!confirmEnabled"
        class="w-full bg-voy-green text-white rounded-full py-4 text-sm font-semibold transition-opacity disabled:opacity-30"
        x-text="ctaLabel"
      ></button>
    </div>

  </div>

  <!-- Success sheet (slides up over modal) -->
  <div
    x-data
    x-show="$store.sheet.isOpen('date-success')"
    x-transition:enter="transition duration-300 ease-[cubic-bezier(0.32,0.72,0,1)]"
    x-transition:enter-start="translate-y-full"
    x-transition:enter-end="translate-y-0"
    x-transition:leave="transition duration-300"
    x-transition:leave-start="translate-y-0"
    x-transition:leave-end="translate-y-full"
    style="display:none"
    class="fixed inset-x-0 bottom-0 md:max-w-sm md:left-1/2 md:-translate-x-1/2 z-20 bg-white rounded-t-3xl px-5 pt-6 pb-10 text-center shadow-2xl"
  >
    <div class="w-12 h-12 rounded-full bg-voy-green-pale flex items-center justify-center mx-auto mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-voy-green" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    </div>
    <h2 class="text-xl font-bold text-gray-900 mb-1">Date updated</h2>
    <p class="text-sm text-gray-400 mb-6" x-html="$store.sheet.data.msg || ''"></p>
    <a href="index.html" class="block w-full bg-voy-green text-white rounded-full py-3.5 text-sm font-semibold hover:opacity-90 transition-opacity">
      Back to plan
    </a>
  </div>

<script type="module" src="/src/js/app.js"></script>
</body>
</html>
